<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basirah Institute of Research & Development</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    width:100%;
    background:#0f2d52;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    z-index:1000;
}

.header-container{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 35px;
}

/* Left Title */

.logo-text{
    color:white;
    font-size:28px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
}

.logo-text .arabic{
    color:#d4af37;
}

/* Navigation */

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:600;
    position:relative;
    transition:.3s;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0;
    height:2px;
    background:#d4af37;
    transition:.3s;
}

nav a:hover{
    color:#d4af37;
}

nav a:hover::after{
    width:100%;
}

/* Logo */

.logo img{
    height:70px;
    display:block;
    transition:.3s;
}

.logo img:hover{
    transform:scale(1.08);
}

/* Mobile */

#menu{
    display:none;
}

.menu-btn{
    display:none;
    font-size:30px;
    color:white;
    cursor:pointer;
}

/* ============ MOBILE ============ */

@media(max-width:900px){

.header-container{
    flex-wrap:wrap;
    padding:15px 20px;
}

.logo-text{
    font-size:18px;
    flex:1;
}

.logo img{
    height:50px;
}

.menu-btn{
    display:block;
    margin-right:15px;
}

nav{
    display:none;
    width:100%;
    flex-direction:column;
    background:#143d6b;
    margin-top:15px;
    border-radius:8px;
    overflow:hidden;
}

nav a{
    text-align:center;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,.12);
}

nav a:last-child{
    border-bottom:none;
}

#menu:checked ~ nav{
    display:flex;
}

}

/* Demo Content */

main{
    padding:60px 40px;
}

.hero{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<header>

<div class="header-container">

    <!-- Left -->
    <div class="logo-text">
        <span class="arabic">بصيرة</span>
        <span>Institute of Research & Development</span>
    </div>

    <!-- Center -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="development.html">Development</a>
    </nav>

    <!-- Right -->
    <div style="display:flex;align-items:center;">

        <label for="menu" class="menu-btn">&#9776;</label>

        <a href="index.html" class="logo">
            <img src="logo1.png" alt="Basirah Logo">
        </a>

    </div>

</div>

<input type="checkbox" id="menu">

</header>

<main>

<div class="hero">

<h1>Welcome to Basirah Institute of Research & Development</h1>

<p>
Your content goes here.
</p>

<br><br><br><br><br><br><br><br><br><br>

<p>Scroll down to test the sticky header.</p>

<br><br><br><br><br><br><br><br><br><br>

<p>More content...</p>

</div>

</main>

</body>
</html>
