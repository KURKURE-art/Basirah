<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basirah Institute of Research & Development</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    width:100%;
    background:#0f2d52;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    z-index:1000;
}

.header-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 35px;
}

/* Left */

.logo-text{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
    font-size:26px;
    font-weight:bold;
}

.logo-text .arabic{
    color:#d4af37;
}

/* Navigation */

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:600;
    position:relative;
    transition:.3s;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-5px;
    width:0;
    height:2px;
    background:#d4af37;
    transition:.3s;
}

nav a:hover{
    color:#d4af37;
}

nav a:hover::after{
    width:100%;
}

/* Right */

.right{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    height:70px;
    display:block;
}

.menu-btn{
    display:none;
    font-size:32px;
    color:white;
    cursor:pointer;
    user-select:none;
}

/* ================= MOBILE ================= */

@media (max-width:900px){

.header-container{
    flex-wrap:wrap;
    padding:15px 20px;
}

.logo-text{
    font-size:18px;
}

.logo img{
    height:50px;
}

.menu-btn{
    display:block;
}

nav{
    display:none;
    flex-direction:column;
    width:100%;
    margin-top:15px;
    background:#143d6b;
    border-radius:8px;
    overflow:hidden;
}

nav.show{
    display:flex;
}

nav a{
    padding:15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.15);
}

nav a:last-child{
    border-bottom:none;
}

}

/* Demo */

main{
    padding:60px 40px;
}

.hero{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

</style>

</head>
<body>

<header>

<div class="header-container">

    <!-- Left -->
    <div class="logo-text">
        <span class="arabic">بصيرة</span>
        <span>Institute of Research & Development</span>
    </div>

    <!-- Center -->
    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="development.html">Development</a>
    </nav>

    <!-- Right -->
    <div class="right">

        <div class="menu-btn" onclick="toggleMenu()">
            ☰
        </div>

        <a href="index.html" class="logo">
            <img src="logo1.png" alt="Basirah Logo">
        </a>

    </div>

</div>

</header>

<main>

<div class="hero">

<h1>Welcome to Basirah Institute of Research & Development</h1>

<p>
Your website content goes here.
</p>

<br><br><br><br><br><br><br><br><br><br>

<p>Scroll to test the sticky header.</p>

<br><br><br><br><br><br><br><br><br><br>

<p>More content...</p>

</div>

</main>

<script>
function toggleMenu(){
    document.getElementById("navMenu").classList.toggle("show");
}
</script>

</body>
</html>
